[project]
name = "afm-3d-search"
version = "0.1.0"
description = "3D Scene Understanding"
authors = [{ name = "Tim Cramer", email = "tim@cramer-dlg.de" }]
readme = "README.md"
dependencies = [
    # PyTorch ecosystem - keep these versions aligned
    "torch==2.3.1",
    "torchvision==0.18.1",
    "xformers>=0.0.26",
    
    # Core dependencies
    "numpy>=1.24.0,<2.0.0",
    "Pillow",
    "huggingface_hub",
    "requests",
    "tqdm",
    "einops",
    "safetensors",
    "trimesh",
    
    # ML models from git
    "clip @ git+https://github.com/openai/CLIP.git",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",

    # SigLIP2 image-text encoder
    "transformers>=4.49",
    "sentencepiece",
    "protobuf",
    
    # Machine learning utilities
    "scikit-learn",
    
    # Configuration management
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",   
    "pyyaml",
    
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "python-multipart"
]

[tool.uv]
managed = true
index-strategy = "unsafe-best-match"

# Add extra index for PyTorch packages (if needed)
# [[tool.uv.index]]
# name = "pytorch"
# url = "https://download.pytorch.org/whl/cu121"

[build-system]
requires = ["setuptools"]